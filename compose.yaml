services:

  # ── 1. Data download & SQLite DB creation ───────────────────────────────────
  data_load:
    build:
      context: src/data_load
    container_name: data_load
    env_file: .env
    environment:
      DATA_DIR: ${DATA_DIR}
      DB_PATH: ${DB_PATH}
    volumes:
      - shared_data:/app/data
    networks:
      - open_data_analytics_network

  # ── 2. Data quality & cleaning ───────────────────────────────────────────────
  data_quality:
    build:
      context: src/data_quality_analysis
    container_name: data_quality
    env_file: .env
    environment:
      DATA_DIR: ${DATA_DIR}
      REPORTS_DIR: ${REPORTS_DIR}
    volumes:
      - shared_data:/app/data
      - shared_reports:/app/reports
    depends_on:
      data_load:
        condition: service_completed_successfully
    networks:
      - open_data_analytics_network

  # ── 3. Exploratory data research ─────────────────────────────────────────────
  data_research:
    build:
      context: src/data_research
    container_name: data_research
    env_file: .env
    environment:
      DATA_DIR: ${DATA_DIR}
      REPORTS_DIR: ${REPORTS_DIR}
    volumes:
      - shared_data:/app/data
      - shared_reports:/app/reports
    depends_on:
      data_quality:
        condition: service_completed_successfully
    networks:
      - open_data_analytics_network

  # ── 4. Visualization (charts) ─────────────────────────────────────────────
  visualization:
    build:
      context: src/visualization
    container_name: visualization
    env_file: .env
    environment:
      DATA_DIR: ${DATA_DIR}
      REPORTS_DIR: ${REPORTS_DIR}
    volumes:
      - shared_data:/app/data
      - shared_reports:/app/reports
    depends_on:
      data_quality:
        condition: service_completed_successfully
    networks:
      - open_data_analytics_network

  # ── 5. Web interface ──────────────────────────────────────────────────────────
  web:
    build:
      context: src/web
    container_name: web
    env_file: .env
    environment:
      DATA_DIR: ${DATA_DIR}
      REPORTS_DIR: ${REPORTS_DIR}
      DB_PATH: ${DB_PATH}
      PORT: ${PORT}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - shared_data:/app/data:ro
      - shared_reports:/app/reports:ro
    depends_on:
      data_research:
        condition: service_completed_successfully
      visualization:
        condition: service_completed_successfully
    networks:
      - open_data_analytics_network
    restart: unless-stopped

  # ── 6. Monitoring ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090" # Open port for demonstration
    volumes:
      - ./monitoring/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000" # Port for browser access
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    volumes:
      - /:/rootfs:ro
    command:
      - '--path.rootfs=/rootfs'
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    restart: unless-stopped

# ── Shared volumes ─────────────────────────────────────────────────────────────
volumes:
  shared_data: # raw XLSX, clean CSV, SQLite DB
  shared_reports:
    # quality_report.json, research_report.json, figures/

# ── Internal network ───────────────────────────────────────────────────────────
networks:
  open_data_analytics_network:
    driver: bridge
