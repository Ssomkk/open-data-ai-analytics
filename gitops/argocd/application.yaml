apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nuclear-analytics
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Ssomkk/open-data-ai-analytics.git
    targetRevision: main
    path: gitops/app

  destination:
    server: https://kubernetes.default.svc
    namespace: open-data-app

  syncPolicy:
    automated:
      prune: true      # видаляє ресурси, яких нема в Git
      selfHeal: true   # відновлює при ручних змінах у кластері
    syncOptions:
      - CreateNamespace=true